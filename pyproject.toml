[project]
name = "gardenpipe"
version = "0.1.0"
description = "Streaming feature pipelines and model search for date-partitioned time series"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "cloudpickle>=3.1.2",
    "numpy>=1.26",
    "optuna>=4.9.0",
    "polars>=1.41.2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
xgboost = ["xgboost>=3.2.0"]
linear = ["scikit-learn>=1.7.2"]
torch = ["torch>=2.12.1"]
tracking = ["tensorboard>=2.16.0", "wandb>=0.28.0"]
viz = ["anywidget>=0.11.0", "matplotlib>=3.10.9", "plotly>=6.8.0", "ipywidgets>=8.1"]
gpu = ["cupy-cuda12x>=14.1.1"]
all = [
    "gardenpipe[xgboost,linear,torch,tracking,viz]",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gardenpipe"]
exclude = ["gardenpipe/feature_rs/target"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
